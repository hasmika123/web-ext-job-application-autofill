<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox - Gmail (demo mailbox)</title>
<style>
  :root { --bg: #f6f8fc; --panel: #ffffff; --ink: #1f1f1f; --muted: #5f6368; --line: #e5e7eb; --sel: #d3e3fd; --new: #e8f0fe; --red: #d93025; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 "Google Sans", Roboto, "Segoe UI", Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 16px; }
  .burger { width: 24px; height: 18px; display: grid; gap: 4px; margin: 0 8px; }
  .burger i { display: block; height: 2px; background: var(--muted); border-radius: 2px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--muted); min-width: 220px; }
  .envelope { width: 32px; height: 24px; border-radius: 4px; position: relative; background: #fff; border: 3px solid var(--red); border-top-width: 3px; }
  .envelope::before, .envelope::after { content: ""; position: absolute; top: -1px; width: 15px; height: 3px; background: var(--red); }
  .envelope::before { left: 0; transform-origin: left; transform: rotate(38deg); }
  .envelope::after { right: 0; transform-origin: right; transform: rotate(-38deg); }
  .search { flex: 1; max-width: 720px; height: 48px; border-radius: 24px; background: #e9eef6; display: flex; align-items: center; padding: 0 20px; color: var(--muted); }
  .me { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #0b8043; color: #fff; display: grid; place-items: center; font-weight: 600; }
  main { display: flex; gap: 8px; padding: 0 16px 16px 0; height: calc(100vh - 64px); }
  nav { width: 256px; padding: 8px 0; }
  .compose { margin: 0 0 16px 8px; height: 56px; width: 140px; border-radius: 16px; background: #c2e7ff; display: flex; align-items: center; gap: 12px; padding: 0 20px; font-weight: 500; }
  .compose b { font-size: 24px; font-weight: 400; }
  nav a { display: flex; justify-content: space-between; height: 32px; align-items: center; padding: 0 12px 0 26px; border-radius: 0 16px 16px 0; color: var(--ink); text-decoration: none; }
  nav a.on { background: var(--sel); font-weight: 700; }
  section { flex: 1; background: var(--panel); border-radius: 16px; overflow: auto; }
  .toolbar { height: 48px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; color: var(--muted); font-size: 13px; gap: 16px; }
  .row { display: grid; grid-template-columns: 220px 1fr 90px; gap: 12px; align-items: center; height: 40px; padding: 0 16px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
  .row:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3); }
  .row.unread { background: #fff; font-weight: 700; }
  .row.read { background: #f2f6fc; }
  .row.fresh { animation: arrive 1.6s ease-out; }
  @keyframes arrive { from { background: #fef7e0; } to { background: #fff; } }
  .from, .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what span { font-weight: 400; color: var(--muted); }
  .when { text-align: right; font-size: 12px; }
  .reader { padding: 24px 32px; }
  .reader h1 { font-size: 22px; font-weight: 400; margin: 0 0 16px; }
  .reader .who { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  .reader .who .avatar { background: #5f6368; }
  .reader .body { white-space: pre-wrap; max-width: 760px; }
  .back { color: var(--muted); cursor: pointer; }
  .toast { position: fixed; left: 24px; bottom: 24px; background: #323232; color: #fff; padding: 14px 20px; border-radius: 6px; box-shadow: 0 3px 8px rgba(0,0,0,.3); opacity: 0; transform: translateY(12px); transition: all .25s; }
  .toast.show { opacity: 1; transform: none; }
  /* presenter controls: small and out of the way; press N to send the next held-back email */
  .demo { position: fixed; right: 18px; bottom: 18px; font-size: 12px; }
  .demo button { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 18px; padding: 7px 14px; cursor: pointer; }
  .demo ul { list-style: none; margin: 0 0 8px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .demo.open ul { display: block; }
  .demo li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .demo li:hover { background: var(--bg); }
  .demo li.done { color: #9aa0a6; cursor: default; text-decoration: line-through; }
  .note { font-size: 11px; color: #9aa0a6; padding: 4px 8px 0; }
</style>
</head>
<body>
<header>
  <div class="burger"><i></i><i></i><i></i></div>
  <div class="brand"><span class="envelope" aria-hidden="true"></span>Gmail</div>
  <div class="search">Search mail</div>
  <div class="me"><span id="addr"></span><span class="avatar">A</span></div>
</header>
<main>
  <nav>
    <div class="compose"><b>✎</b>Compose</div>
    <a class="on" href="#">Inbox <span id="count"></span></a>
    <a href="#">Starred</a><a href="#">Snoozed</a><a href="#">Sent</a><a href="#">Drafts</a>
  </nav>
  <section id="pane"></section>
</main>
<div class="toast" id="toast"></div>
<div class="demo" id="demo">
  <ul id="groups"></ul>
  <button type="button" id="demoBtn" title="Presenter: send the next demo email (or press N)">Demo: send email</button>
  <div class="note">Simulated mailbox for the demo</div>
</div>
<script>
  const pane = document.getElementById("pane");
  let state = { inbox: [], groups: [], address: "" };
  const seen = new Set(JSON.parse(sessionStorage.getItem("seen") || "[]"));
  let opened = null;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const key = (m) => m.subject + "|" + m.at;
  function when(iso) {
    const d = new Date(iso), now = new Date();
    return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function toast(t) {
    const el = document.getElementById("toast");
    el.textContent = t;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3500);
  }
  function render(fresh) {
    document.getElementById("addr").textContent = state.address;
    const unread = state.inbox.filter((m) => !seen.has(key(m))).length;
    document.getElementById("count").textContent = unread ? unread : "";
    if (opened) {
      const m = opened;
      pane.innerHTML = `<div class="toolbar"><span class="back" id="back">← Back to Inbox</span></div><div class="reader"><h1>${esc(m.subject)}</h1><div class="who"><span class="avatar">${esc(m.fromName[0] || "?")}</span><div><b>${esc(m.fromName)}</b><br><span style="color:#5f6368;font-size:12px">to me · ${esc(new Date(m.at).toLocaleString())}</span></div></div><div class="body">${esc(m.snippet)}</div></div>`;
      document.getElementById("back").onclick = () => { opened = null; render(); };
      return;
    }
    pane.innerHTML = `<div class="toolbar">☐ &nbsp; ↻ &nbsp; ⋮ <span style="margin-left:auto">1–${state.inbox.length} of ${state.inbox.length}</span></div>` +
      state.inbox.map((m, i) => `<div class="row ${seen.has(key(m)) ? "read" : "unread"} ${fresh && fresh.has(key(m)) ? "fresh" : ""}" data-i="${i}"><div class="from">${esc(m.fromName)}</div><div class="what">${esc(m.subject)} <span>- ${esc(m.snippet)}</span></div><div class="when">${esc(when(m.at))}</div></div>`).join("");
    pane.querySelectorAll(".row").forEach((r) => (r.onclick = () => { opened = state.inbox[+r.dataset.i]; seen.add(key(opened)); sessionStorage.setItem("seen", JSON.stringify([...seen])); render(); }));
    const ul = document.getElementById("groups");
    ul.innerHTML = state.groups.map((g) => `<li class="${g.delivered ? "done" : ""}" data-k="${esc(g.key)}">${esc(g.label)}</li>`).join("") || "<li class='done'>Nothing held back</li>";
    ul.querySelectorAll("li[data-k]:not(.done)").forEach((li) => (li.onclick = () => send(li.dataset.k)));
  }
  async function load(first) {
    const r = await fetch("/demo-api/inbox", { cache: "no-store" });
    if (!r.ok) { pane.innerHTML = `<div class="reader">The demo mailbox is not reachable (is the demo API running with DOSSIER_DEMO_INBOX_STAGED=true?).</div>`; return; }
    const before = new Set(state.inbox.map(key));
    state = await r.json();
    if (first) state.inbox.forEach((m) => { if (!m.live) seen.add(key(m)); });
    const fresh = new Set(state.inbox.map(key).filter((k) => !first && !before.has(k)));
    if (fresh.size) { const m = state.inbox.find((x) => fresh.has(key(x))); toast(`New message from ${m.fromName}: ${m.subject}`); }
    render(fresh);
  }
  async function send(k) {
    document.getElementById("demo").classList.remove("open");
    await fetch(`/demo-api/deliver/${encodeURIComponent(k)}`, { method: "POST" });
    setTimeout(() => load(false), 900); // a beat, like a real arrival
  }
  document.getElementById("demoBtn").onclick = () => document.getElementById("demo").classList.toggle("open");
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() !== "n" || e.target.tagName === "INPUT") return;
    const next = state.groups.find((g) => !g.delivered);
    if (next) send(next.key);
  });
  load(true);
  setInterval(() => load(false), 5000);
</script>
</body>
</html>
