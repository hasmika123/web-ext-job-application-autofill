<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Resume Builder roadmap</title>
<meta name="description" content="Roadmap and progress for the Resume Builder + Common Profile (branch resume-builder).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F8FD; --bg2:#E8F1FB; --card:#FFFFFF; --ink:#0C2340; --ink2:#2B4262; --muted:#5A6D86; --line:#DCE7F3;
  --accent:#84E63C; --accent-d:#5DB81F; --accent-ink:#173B05; --accent-soft:#EAF9DA;
  --blue:#2F6BFF; --blue-soft:#E4EEFF; --amber:#B7791F; --amber-soft:#FFF3D6; --red:#C73A3A; --red-soft:#FDE8E8;
  --violet:#6B4FD8; --violet-soft:#EEEAFE; --gray-soft:#EDF1F6; --shadow:0 1px 2px rgba(12,35,64,.05),0 8px 24px rgba(12,35,64,.06);
  --focus:#2F6BFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424; --bg2:#0F1D33; --card:#112039; --ink:#E9F0FA; --ink2:#C3D2E6; --muted:#8FA3BF; --line:#22375A;
    --accent:#84E63C; --accent-d:#9BEF5E; --accent-ink:#0B2503; --accent-soft:#1A3114;
    --blue:#7CA4FF; --blue-soft:#172A52; --amber:#F2C066; --amber-soft:#3A2D12; --red:#FF8A8A; --red-soft:#3D1A1F;
    --violet:#B3A2FF; --violet-soft:#2A2352; --gray-soft:#1A2B47; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --focus:#9BB9FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424; --bg2:#0F1D33; --card:#112039; --ink:#E9F0FA; --ink2:#C3D2E6; --muted:#8FA3BF; --line:#22375A;
  --accent:#84E63C; --accent-d:#9BEF5E; --accent-ink:#0B2503; --accent-soft:#1A3114;
  --blue:#7CA4FF; --blue-soft:#172A52; --amber:#F2C066; --amber-soft:#3A2D12; --red:#FF8A8A; --red-soft:#3D1A1F;
  --violet:#B3A2FF; --violet-soft:#2A2352; --gray-soft:#1A2B47; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --focus:#9BB9FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--gray-soft);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
h1,h2,h3{line-height:1.2;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hero */
.hero{padding:24px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:linear-gradient(135deg,var(--card) 0%,var(--accent-soft) 160%)}
.hero h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--ink2);font-size:12.5px;font-weight:600;white-space:nowrap}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:var(--line)} .ring .p{stroke:var(--accent-d);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:30px;font-weight:800;line-height:1}
.ring .c span{font-size:11.5px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.num{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.num b{font-size:22px;font-weight:800}
.num small{display:block;color:var(--muted);font-size:12.5px}
.rule{font-size:13px;color:var(--ink2);background:var(--bg2);border-radius:12px;padding:8px 12px;margin:0}
.counters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.counter{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:6px 12px;font-weight:700;font-size:13px;border:1px solid transparent}
.counter b{font-size:18px}
.s-not_started{background:var(--gray-soft);color:var(--ink2)}
.s-in_progress{background:var(--blue-soft);color:var(--blue)}
.s-in_review{background:var(--violet-soft);color:var(--violet)}
.s-done{background:var(--accent-soft);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-done{color:var(--accent-d)}}
:root[data-theme="dark"] .s-done{color:var(--accent-d)}
.s-blocked{background:var(--red-soft);color:var(--red)}

.design-line{display:flex;gap:14px;align-items:center;padding:14px 18px;margin-top:14px;flex-wrap:wrap}
.design-line .t{flex:1;min-width:200px}
.design-line .t b{display:block}
.design-line .t small{color:var(--muted)}

/* bars */
.bar{height:10px;border-radius:999px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));border-radius:999px;transition:width .5s}

/* next up */
.nextup{margin-top:18px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;border-color:var(--accent-d)}
.nextup h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
.nextup .nid{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);display:inline-block;padding:2px 10px;border-radius:999px}
.nextup h3{font-size:18px;margin:8px 0 6px}
.nextup>div,.hero>div,.detail>*,.story,.stories{min-width:0}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.stepper li{flex:1 0 64px;min-width:64px;text-align:center;position:relative}
.stepper li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.stepper li:first-child::before{display:none}
.stepper li.done::before{background:var(--accent-d)}
.stepper button{all:unset;cursor:pointer;display:block;width:100%;text-align:center;position:relative;z-index:1;padding:2px 0}
.stepper .dot{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;margin:0 auto 4px;background:var(--card);border:2px solid var(--line);font-size:12px;font-weight:800}
.stepper li.done .dot{background:var(--accent);border-color:var(--accent-d);color:var(--accent-ink)}
.stepper li.next .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.stepper li.active .dot{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.stepper .lab{font-size:11px;color:var(--muted);line-height:1.2;display:block;padding:0 2px}
.stepper button:focus-visible{outline:3px solid var(--focus);border-radius:10px}

/* toolbar */
.toolbar{margin-top:18px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search],.toolbar select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:42px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 auto;max-width:100%}
.btn{font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;min-height:42px}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--accent);border-color:var(--accent-d);color:var(--accent-ink)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;min-height:42px;padding:0 6px}
.chk input{width:18px;height:18px;accent-color:var(--accent-d)}
.count{font-size:13px;color:var(--muted);margin:10px 4px 0}

/* epics */
.epic{margin-top:16px;overflow:hidden}
.epic-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;padding:16px 20px;align-items:center}
.eid{font-weight:800;font-size:15px;background:var(--ink);color:var(--card);border-radius:12px;padding:6px 12px;min-width:48px;text-align:center}
.eh{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.eg{display:block;margin:2px 0 0;color:var(--muted);font-size:13.5px}
.epic-r{text-align:right;min-width:150px}
.epic-r .pct{font-size:24px;font-weight:800;line-height:1}
.epic-r small{display:block;color:var(--muted);font-size:12.5px}
.epic-bar{grid-column:1/-1;display:flex;gap:12px;align-items:center}
.epic-bar .bar{flex:1}
.epic-toggle{all:unset;cursor:pointer;display:grid;grid-column:1/-1;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;width:100%}
.epic-toggle:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:14px}
.chev{display:inline-block;transition:transform .2s;font-size:12px;color:var(--muted)}
[aria-expanded="true"]>.chev,[aria-expanded="true"] .chev{transform:rotate(90deg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.size{background:var(--bg2);color:var(--ink2);min-width:26px;justify-content:center}
.chip.own{background:var(--blue-soft);color:var(--blue)}
.chip.own.API{background:var(--violet-soft);color:var(--violet)} .chip.own.ui{background:var(--accent-soft);color:var(--accent-ink)}
.chip.own.ext{background:var(--amber-soft);color:var(--amber)} .chip.own.ops{background:var(--gray-soft);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.own.ui{color:var(--accent-d)}}
:root[data-theme="dark"] .chip.own.ui{color:var(--accent-d)}
.star{color:#E0A100;font-size:15px;line-height:1}
.epic-note{margin:0 20px 12px;font-size:12.5px;color:var(--muted)}
.stories{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.story{border-bottom:1px solid var(--line)}
.story:last-child{border-bottom:0}
.srow{all:unset;cursor:pointer;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 20px;width:100%;box-sizing:border-box}
.srow:hover{background:var(--bg)}
.srow:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.sid{font-weight:800;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.stitle{font-weight:600;overflow-wrap:anywhere}
.schips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.sdeps{grid-column:2/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dep{font-weight:700;font-size:11.5px;padding:1px 7px;border-radius:8px;background:var(--gray-soft);color:var(--ink2)}
.dep.ok{background:var(--accent-soft);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dep.ok{color:var(--accent-d)}}
:root[data-theme="dark"] .dep.ok{color:var(--accent-d)}
.ready{font-weight:700;color:var(--accent-ink);background:var(--accent);padding:1px 8px;border-radius:999px;font-size:11.5px}
.detail{padding:4px 20px 18px 20px;display:grid;gap:12px;background:var(--bg)}
.detail[hidden]{display:none}
.detail h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.detail .us{font-size:15px;font-weight:600;margin:12px 0 0;border-left:4px solid var(--accent);padding-left:12px}
.detail ul{margin:0;padding-left:20px}
.detail li{margin:3px 0;overflow-wrap:anywhere}
.detail p{margin:0;overflow-wrap:anywhere}
.cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kv{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* deps view */
.depview{margin-top:22px;padding:18px 20px}
.depview h2{font-size:18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.dcol{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}
.dcol h3{font-size:13px;margin-bottom:8px}
.drow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;padding:3px 0}
.drow b{min-width:38px}
.arrow{color:var(--muted)}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 16px}
  .hero .eyebrow,.hero .counters{justify-content:center}
  .nextup{grid-template-columns:1fr}
  .epic-h,.epic-toggle{grid-template-columns:auto minmax(0,1fr)}
  .epic-r{grid-column:1/-1;text-align:left;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .srow{grid-template-columns:52px minmax(0,1fr);padding:12px 14px}
  .schips{grid-column:2/-1;justify-content:flex-start}
  .sdeps{grid-column:2/-1}
  .detail{padding:4px 14px 16px}
  .epic-h{padding:14px}
  .toolbar select{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="sr" href="#epics">Skip to epics</a>
  <header class="card hero" id="top">
    <div class="ring" role="img" aria-label="Weighted progress" id="ring"></div>
    <div>
      <p class="eyebrow"><span class="pill" id="branch"></span><span class="pill" id="updated"></span><a class="pill" href="design.html">Visual design walkthrough</a></p>
      <h1 id="title"></h1>
      <div class="nums" id="nums"></div>
      <p class="rule" id="rule"></p>
      <div class="counters" id="counters" aria-label="Story counts by status"></div>
    </div>
  </header>

  <section class="card design-line" id="designLine" aria-label="Design deliverables"></section>

  <section class="card nextup" id="nextup" aria-label="Next up"></section>

  <form class="card toolbar" id="toolbar" role="search" aria-label="Filter stories" onsubmit="return false">
    <input type="search" id="q" placeholder="Search stories, ACs, notes..." aria-label="Search stories">
    <select id="fStatus" aria-label="Filter by status"></select>
    <select id="fOwner" aria-label="Filter by owner type"></select>
    <select id="fEpic" aria-label="Filter by epic"></select>
    <label class="chk"><input type="checkbox" id="fReady"> Ready to start</label>
    <button type="button" class="btn" id="expAll">Expand all</button>
    <button type="button" class="btn" id="colAll">Collapse all</button>
    <button type="button" class="btn" id="reset">Reset</button>
  </form>
  <p class="count" id="count" aria-live="polite"></p>

  <main id="epics"></main>

  <section class="card depview" id="depview">
    <h2>Dependency view</h2>
    <p class="muted" style="margin:6px 0 0;font-size:13.5px">Each story lists the stories that must be Done first. <span class="dep ok">green</span> = satisfied. <span class="ready">ready</span> = all dependencies done and not started. An epic id (e.g. R2) means every story in that epic.</p>
    <div class="dgrid" id="dgrid"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

the no-JS path; persists via `/reorder`; optimistic with rollback."],"tech":"","tests":"keyboard reorder component test; `reorder` optimistic rollback test.","supersedes":[],"design":"docs/RESUME-BUILDER-DESIGN.md"},{"id":"R1.4","epic":"R1","title":"Onboarding wizard — `/profiles/setup` path picker, Upload + Paste steps, card-by-card review, finish","status":"not_started","size":"L","owners":["web","ui"],"star":false,"deps":["R1.1"],"depsNote":"R1.1 (+ ui `Stepper`, `SwipeCard`). Size L. Owner web + ui.","story":"As a new user, I want to build my profile from my resume by confirming cards so that I never fill a long form.","ac":["`ProfileSetup` with `Stepper`; `PathPicker` (3 cards); `UploadStep` reuses `parseResumeWithAi` / heuristic fallback and the consent copy from `ResumeUpload`; `PasteStep` (textarea → same pipeline, `text` only); `ReviewCards` — one card per experience/education/project with Keep / Edit / Skip, `SwipeCard` gestures on touch, buttons always; skills chip cloud with parsed suggestions; identity confirm card from `ParsedBio` (prefills, never overwrites a `user` provenance value without asking); preferences step shows the six `/welcome` questions if unanswered; `FinishStep` with the meter + `nextAction` + one confetti (reduced-motion safe).","nothing persists until Finish → one `POST /api/profile/items/import` (+ `PUT /api/profile`); abandon-safe (draft in `sessionStorage`).","entry points: dashboard \"Build your profile\" card when completeness \u003c 40, `/profiles` empty states, the extension's existing \"set up on the web\" link target (`/profiles/setup`).","analytics events `profile_setup_*`.","Upload and Paste steps pass the extracted text through SensitivePatterns (T1.1) before parsing: SSN/ITIN, bank/routing, tax IDs, passport/visa/document numbers and birth dates are redacted from the text sent to the AI parser and can never become profile items; the review shows \"we removed N sensitive values — we never collect those\"."],"tech":"","tes actions call audited routes, readiness table for admin, scope-revoked 403 → \"This member stopped sharing\", 390 px Filters sheet), `OrgResumeViewer.test.tsx` (print/PDF panes, download disabled until READY).","relates":["O1.6","O1.7"],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[]},{"id":"R8.3","epic":"R8","title":"Org marks, saved views, bulk actions, assign to opportunity, CSV export","status":"not_started","size":"M","owners":["web","API"],"star":false,"deps":["R8.2"],"depsNote":"Cross-area prerequisites (must be built first): O10.5.","story":"As an org marketer, I want to shortlist, save views, act in bulk and assign a shared resume to an opportunity — without Kiwiply ever ranking or submitting for anyone.","ac":["`POST …/resumes/{id}/mark`, `POST …/resumes/bulk` (SHORTLIST/UNSHORTLIST/ARCHIVE_VIEW/ASSIGN with `skipped` reasons incl. 409 `ASSIGNMENT_UNAVAILABLE`), saved views CRUD (max `org.resumes.maxSavedViews`), `export.csv`; UI: ★ toggle, Shortlisted tab, bulk bar (Shortlist · Unshortlist · Hide from my list · Assign to opportunity… · Export CSV), Assign sheet listing `/org/opportunities` → `job_assignment` with this resume as default (O10.5), Save View / saved views menu; marketer-made resumes show \"Approval pending\" and are not assignable until approved (`ApprovalGateTest` pattern)."],"tech":"DESIGN §9.12, §10.18. Java `OrgResumeResource` (mark, bulk, views, csv), web `OrgResumesPage.tsx` (bulk bar), `AssignSheet.tsx`.","tests":"`OrgResumeMarkIT` (own marks only; another marketer's marks invisible; bulk skipped reasons; assign unapproved → 409; csv audited and contact-free), `OrgResumesPage.bulk.test.tsx`, `AssignSheet.test.tsx`.","relates":["O10.5","O10.4"],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[]},{"id":"R7.6","epic":"R7","title":"Autopilot hook — batch-prepare picks the best built resume per job (score + match) and waits for READY PDFs (Phase 19)","status":"not_started","size":"S","owners":["API"],"star":false,"deps":["R5.9","R3.7"],"depsNote":"","story":"As Autopilot, I want to attach the right, up-to-date PDF per job without a user round-trip.","ac":["Picker prefers a tailored copy whose job matches, else the primary; waits for `pdf.status == READY` (parks `NEEDS_YOU` after `resume.pdf.maxAttempts`); never submits."],"tech":"DESIGN §8.5, §12.6.","tests":"`AutopilotResumePickerTest`.","relates":[],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[]},{"id":"R2.3","epic":"R2","title":"(superseded by R2.8) Classic + Compact templates, template picker drawn with the live doc, thumbnails","status":"not_started","size":"S","owners":[],"star":false,"deps":[],"depsNote":"Superseded by R2.8; not a work item.","story":"","ac":[],"tech":"","tests":"","relates":["R2.8"],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[],"tombstone":true},{"id":"R4.4","epic":"R4","title":"(superseded by R4.2) Fit-to-one-page assist (AI shorten of the longest bullets when the ladder ends)","status":"not_started","size":"S","owners":[],"star":false,"deps":[],"depsNote":"Superseded by R4.2; not a work item.","story":"","ac":[],"tech":"","tests":"","relates":["R4.2"],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[],"tombstone":true},{"id":"R4.5","epic":"R4","title":"(superseded by R4.2) Grammar & consistency — AI mode + deterministic auto-fixes","status":"not_started","size":"S","owners":[],"star":false,"deps":[],"depsNote":"Superseded by R4.2; not a work item.","story":"","ac":[],"tech":"","tests":"","relates":["R4.2"],"supersedes":[],"benchmark":"","design":"docs/RESUME-BUILDER-DESIGN.md","settings":[],"tombstone":true}]}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('rb-data').textContent);
var W=D.sizeWeights;
var LAB={not_started:'Not started',in_progress:'In progress',in_review:'In review',done:'Done',blocked:'Blocked'};
var GLY={not_started:'○',in_progress:'◐',in_review:'◎',done:'✓',blocked:'✕'};
var byId={};D.stories.forEach(function(s){byId[s.id]=s;});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function md(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function $(id){return document.getElementById(id);}
function chip(st){return '<span class="chip s-'+st+'"><span aria-hidden="true">'+GLY[st]+'</span>'+LAB[st]+'</span>';}
function depTargets(tok){ if(byId[tok])return [byId[tok]]; return D.stories.filter(function(s){return s.epic===tok;}); }
function depDone(tok){var t=depTargets(tok);return t.length>0&&t.every(function(s){return s.status==='done';});}
function isReady(s){return s.status==='not_started'&&s.deps.every(depDone);}
function unblocks(id){return D.stories.filter(function(s){return s.deps.some(function(t){return t===id||(!byId[t]&&byId[id]&&byId[id].epic===t);});}).map(function(s){return s.id;});}

/* ---- stats ---- */
var total=D.stories.length, totalW=0, doneW=0, cnt={not_started:0,in_progress:0,in_review:0,done:0,blocked:0};
D.stories.forEach(function(s){var w=W[s.size]||1;totalW+=w;cnt[s.status]++;if(s.status==='done')doneW+=w;});
var pctS=total?Math.round(cnt.done/total*100):0, pctW=totalW?Math.round(doneW/totalW*100):0;

$('title').textContent=D.project+' roadmap';
$('branch').textContent='branch '+D.branch;
$('updated').textContent='Last updated '+D.updated;
var R=64,C=2*Math.PI*R;
$('ring').innerHTML='<svg viewBox="0 0 150 150" aria-hidden="true"><circle class="t" cx="75" cy="75" r="'+R+'" fill="none" stroke-width="14"/><circle class="p" cx="75" cy="75" r="'+R+'" fill="none" stroke-width="14" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pctW/100)).toFixed(1)+'"/></svg><div class="c"><b>'+pctW+'%</b><span>weighted</span></div>';
$('ring').setAttribute('aria-label','Weighted progress '+pctW+' percent');
$('nums').innerHTML='<div class="num"><b>'+pctW+'%</b><small>Weighted: '+doneW+' of '+totalW+' points done</small></div><div class="num"><b>'+pctS+'%</b><small>By count: '+cnt.done+' of '+total+' stories done</small></div>';
$('rule').innerHTML='<b>Weighting rule:</b> size S = 1 point, M = 2, L = 3 (S &le; half a day, M &approx; 1 day, L &approx; 2 days). Only stories marked <b>Done</b> earn points; in progress and in review earn none until they land.';
$('counters').innerHTML=['done','in_progress','in_review','not_started','blocked'].map(function(k){return '<span class="counter s-'+k+'"><b>'+cnt[k]+'</b> '+LAB[k]+'</span>';}).join('');
$('designLine').innerHTML='<span class="eid">'+esc(D.design.id)+'</span><div class="t"><b>R-design: '+esc(D.design.title)+'</b><small>'+esc(D.design.note)+'</small></div><div style="flex:1 1 180px;min-width:140px"><div class="bar" role="img" aria-label="Design 100 percent"><i style="width:100%"></i></div></div><b>100%</b>'+chip(D.design.status);

/* ---- next up + skeleton ---- */
var next=D.stories.filter(isReady)[0];
var skeleton=['R0.1','R0.2','R0.3','R0.4','R0.5','R0.6','R0.7'];
var labs={ 'R0.1':'Schema','R0.2':'Doc contract','R0.3':'Doc API','R0.4':'ui + Modern','R0.5':'Web editor','R0.6':'PDF','R0.7':'Verify'};
function nextHtml(){
  var h='<div><h2>Next up</h2>';
  if(next){
    h+='<span class="nid">'+next.id+(next.star?' ★':'')+'</span> <span class="chip size">'+next.size+'</span> '+next.owners.map(function(o){return '<span class="chip own '+o+'">'+o+'</span>';}).join(' ')+'<h3>'+md(next.title)+'</h3><p class="muted" style="margin:0 0 10px;font-size:13.5px">'+(next.story?md(next.story):'First unstarted story whose dependencies are all done.')+'</p><button class="btn primary" type="button" data-goto="'+next.id+'">Open story</button>';
  } else if(cnt.done===total){h+='<h3>All stories are done.</h3>';}
  else h+='<h3>Nothing is ready</h3><p class="muted">Every unstarted story is waiting on a dependency.</p>';
  h+='</div><div><h2>Walking skeleton R0.1 &rarr; R0.7 &middot; DB &rarr; API &rarr; editor &rarr; template &rarr; PDF</h2><ol class="stepper">';
  skeleton.forEach(function(id){var s=byId[id];var c=s.status==='done'?'done':(next&&next.id===id?'next':(s.status!=='not_started'?'active':''));
    h+='<li class="'+c+'"><button type="button" data-goto="'+id+'" aria-label="'+id+' '+esc(labs[id])+', '+LAB[s.status]+(c==='next'?', next up':'')+'"><span class="dot">'+(s.status==='done'?'✓':id.slice(3))+'</span><span class="lab">'+id+'<br>'+esc(labs[id])+'</span></button></li>';});
  h+='</ol><p class="muted" style="font-size:12.5px;margin:10px 0 0">One story = one commit = one push (commit prefix <code>rb&lt;epic&gt;.&lt;n&gt;:</code>). The five starred stories (R0.1&ndash;R0.5) are built first.</p></div>';
  $('nextup').innerHTML=h;
}
nextHtml();

/* ---- filters ---- */
var F={q:'',status:'',owner:'',epic:'',ready:false};
function opt(v,l){return '<option value="'+esc(v)+'">'+esc(l)+'</option>';}
$('fStatus').innerHTML=opt('','All statuses')+D.statuses.map(function(k){return opt(k,LAB[k]);}).join('');
$('fOwner').innerHTML=opt('','All owner types')+['API','web','ui','ext','ops'].map(function(o){return opt(o,o);}).join('');
$('fEpic').innerHTML=opt('','All epics')+D.epics.map(function(e){return opt(e.id,e.id+' - '+e.name);}).join('');
function hay(s){return (s.id+' '+s.title+' '+s.story+' '+s.ac.join(' ')+' '+s.tech+' '+s.tests+' '+s.owners.join(' ')+' '+s.deps.join(' ')).toLowerCase();}
D.stories.forEach(function(s){s._h=hay(s);});
function match(s){
  if(F.status&&s.status!==F.status)return false;
  if(F.owner&&s.owners.indexOf(F.owner)<0)return false;
  if(F.epic&&s.epic!==F.epic)return false;
  if(F.ready&&!isReady(s))return false;
  if(F.q){var parts=F.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<parts.length;i++)if(s._h.indexOf(parts[i])<0)return false;}
  return true;
}

/* ---- render epics ---- */
var openStory={}, closedEpic={};
function epicStats(e){
  var ss=D.stories.filter(function(s){return s.epic===e.id;});
  var tw=0,dw=0,dn=0,started=0;ss.forEach(function(s){var w=W[s.size]||1;tw+=w;if(s.status==='done'){dw+=w;dn++;}if(s.status!=='not_started')started++;});
  var st=dn===ss.length?'done':(started?'in_progress':'not_started');
  return {n:ss.length,done:dn,tw:tw,dw:dw,pct:tw?Math.round(dw/tw*100):0,status:st};
}
function storyHtml(s){
  var open=!!openStory[s.id];
  var ready=isReady(s);
  var h='<li class="story" id="s-'+s.id+'"><button class="srow" type="button" aria-expanded="'+open+'" aria-controls="d-'+s.id+'" data-story="'+s.id+'">';
  h+='<span class="sid">'+s.id+'</span><span class="stitle">'+(s.star?'<span class="star" title="First five: build these first" aria-label="first five">★</span> ':'')+md(s.title)+'</span>';
  h+='<span class="schips">'+chip(s.status)+'<span class="chip size" title="Size '+s.size+' = '+W[s.size]+' point(s)'+(s.sizeEstimated?' (estimated: STORIES.md gives R7 only a range)':'')+'">'+(s.sizeEstimated?'~':'')+s.size+'</span>'+(s.owners.length?s.owners.map(function(o){return '<span class="chip own '+o+'">'+o+'</span>';}).join(''):'<span class="chip own ops" title="Owner not specified in STORIES.md">owner TBD</span>')+'</span>';
  h+='<span class="sdeps">';
  if(s.deps.length){h+='<span>needs</span>'+s.deps.map(function(t){return '<span class="dep'+(depDone(t)?' ok':'')+'">'+t+'</span>';}).join('');}
  else h+='<span>no dependencies</span>';
  if(ready)h+='<span class="ready">ready</span>';
  h+='</span></button>';
  h+='<div class="detail" id="d-'+s.id+'" role="region" aria-label="'+s.id+' details"'+(open?'':' hidden')+'>';
  if(s.story)h+='<p class="us">'+md(s.story)+'</p>';
  if(s.ac.length)h+='<div><h4>Acceptance criteria</h4><ul>'+s.ac.map(function(a){return '<li>'+md(a.replace(/^\s+/,''))+'</li>';}).join('')+'</ul></div>';
  else h+='<p class="muted">Written when scheduled (see RESUME-BUILDER-STORIES.md, R7).</p>';
  if(s.tech)h+='<div><h4>Technical notes</h4><p>'+md(s.tech)+'</p></div>';
  if(s.tests)h+='<div><h4>Test expectations</h4><p>'+md(s.tests)+'</p></div>';
  var ub=unblocks(s.id);
  h+='<div class="kv"><h4 style="margin:0">Blocked by</h4>'+(s.deps.length?s.deps.map(function(t){return '<button type="button" class="dep'+(depDone(t)?' ok':'')+'" style="border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:700" data-goto="'+t+'">'+t+'</button>';}).join(''):'<span class="muted">nothing</span>')+'<h4 style="margin:0 0 0 12px">Unblocks</h4>'+(ub.length?ub.map(function(t){return '<button type="button" class="dep" style="border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:700" data-goto="'+t+'">'+t+'</button>';}).join(''):'<span class="muted">nothing</span>')+'</div>';
  h+='<div class="cmd">Update status: <code>node docs/resume-builder/build-roadmap.mjs --set '+s.id+'=in_progress</code></div>';
  h+='</div></li>';
  return h;
}
function render(){
  var out='',shown=0;
  D.epics.forEach(function(e){
    var st=epicStats(e);
    var list=D.stories.filter(function(s){return s.epic===e.id&&match(s);});
    if(!list.length)return;
    shown+=list.length;
    var collapsed=!!closedEpic[e.id];
    out+='<section class="card epic" id="e-'+e.id+'" aria-labelledby="eh-'+e.id+'"><div class="epic-h"><button class="epic-toggle" type="button" aria-expanded="'+!collapsed+'" data-epic="'+e.id+'">';
    out+='<span class="eid">'+e.id+'</span><span><span class="eh" id="eh-'+e.id+'"><span class="chev" aria-hidden="true">▶</span> '+esc(e.name)+'</span><span class="eg">'+esc(e.goal)+'</span></span>';
    out+='<span class="epic-r"><span class="pct">'+st.pct+'%</span> '+chip(st.status)+'<small>'+st.done+' of '+st.n+' stories &middot; '+st.dw+'/'+st.tw+' pts</small></span>';
    out+='<span class="epic-bar"><span class="bar" role="img" aria-label="'+esc(e.name)+' '+st.pct+' percent"><i style="width:'+st.pct+'%"></i></span></span></button></div>';
    if(!collapsed){
      if(e.note)out+='<p class="epic-note">'+md(e.note)+' Sizes marked <b>~</b> are estimates; the doc only gives a range.</p>';
      out+='<ul class="stories">'+list.map(storyHtml).join('')+'</ul>';
    }
    out+='</section>';
  });
  $('epics').innerHTML=out||'<div class="card empty">No stories match these filters.</div>';
  $('count').textContent='Showing '+shown+' of '+total+' stories';
}
function renderDeps(){
  $('dgrid').innerHTML=D.epics.map(function(e){
    var ss=D.stories.filter(function(s){return s.epic===e.id;});
    return '<div class="dcol"><h3>'+e.id+' &middot; '+esc(e.name)+'</h3>'+ss.map(function(s){
      return '<div class="drow"><b>'+s.id+'</b><span class="arrow" aria-hidden="true">&larr;</span><span class="sr">needs</span>'+(s.deps.length?s.deps.map(function(t){return '<span class="dep'+(depDone(t)?' ok':'')+'">'+t+'</span>';}).join(''):'<span class="muted">none</span>')+(isReady(s)?'<span class="ready">ready</span>':'')+'</div>';
    }).join('')+'</div>';
  }).join('');
}
$('foot').innerHTML='Source of truth: <code>docs/resume-builder/stories.json</code>. Regenerate this page with <code>node docs/resume-builder/build-roadmap.mjs</code>. Story text is copied from <code>docs/RESUME-BUILDER-STORIES.md</code>; R7 stories have no text yet there, and their sizes are estimates. Generated 2026-10-12.';

/* ---- events ---- */
function reflow(){render();}
$('q').addEventListener('input',function(e){F.q=e.target.value.trim();reflow();});
$('fStatus').addEventListener('change',function(e){F.status=e.target.value;reflow();});
$('fOwner').addEventListener('change',function(e){F.owner=e.target.value;reflow();});
$('fEpic').addEventListener('change',function(e){F.epic=e.target.value;reflow();});
$('fReady').addEventListener('change',function(e){F.ready=e.target.checked;reflow();});
$('expAll').addEventListener('click',function(){closedEpic={};D.stories.forEach(function(s){if(match(s))openStory[s.id]=true;});render();});
$('colAll').addEventListener('click',function(){openStory={};render();});
$('reset').addEventListener('click',function(){F={q:'',status:'',owner:'',epic:'',ready:false};$('q').value='';$('fStatus').value='';$('fOwner').value='';$('fEpic').value='';$('fReady').checked=false;render();});
function goto(id){
  var s=byId[id];
  if(!s){var e=document.getElementById('e-'+id);if(e){e.scrollIntoView({block:'start'});}return;}
  F={q:'',status:'',owner:'',epic:'',ready:false};$('q').value='';$('fStatus').value='';$('fOwner').value='';$('fEpic').value='';$('fReady').checked=false;
  closedEpic[s.epic]=false;openStory[id]=true;render();
  var el=document.getElementById('s-'+id);if(el){el.scrollIntoView({block:'center'});var b=el.querySelector('.srow');if(b)b.focus({preventScroll:true});}
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-goto],[data-story],[data-epic]');if(!t)return;
  if(t.dataset.goto){goto(t.dataset.goto);return;}
  if(t.dataset.story){var id=t.dataset.story;openStory[id]=!openStory[id];var d=document.getElementById('d-'+id);t.setAttribute('aria-expanded',String(!!openStory[id]));d.hidden=!openStory[id];return;}
  if(t.dataset.epic){var e=t.dataset.epic;closedEpic[e]=!closedEpic[e];render();var nb=document.querySelector('[data-epic="'+e+'"]');if(nb)nb.focus();}
});
render();renderDeps();
})();
</script>
</body>
</html>
