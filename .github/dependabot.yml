# Dependency updates (gap D-5; user decision 2026-11-18: weekly, grouped, into develop).
#
# - Every ecosystem opens at most ONE grouped pull request a week (patch and minor together; majors in their own group, so a breaking
#   upgrade is never hidden in a routine one), into `develop`, never `main` (main is the production deploy branch, CLAUDE.md).
# - GitHub Actions keeps the full-sha pins in .github/workflows/*.yml current (REAL-GAPS-C P2.6): Dependabot rewrites both the sha and
#   the "# v7" comment.
# - Security alerts and Dependabot's own security-update PRs are switched on in the repository settings, not here. GitHub always opens
#   security-update PRs against the default branch (main): retarget them to develop before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The npm workspaces (root package-lock.json: web, job-autofill, packages/*).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # The Spring Boot API.
  - package-ecosystem: "gradle"
    directory: "/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
      gradle-major:
        update-types: ["major"]

  # Base images of the deployed containers.
  - package-ecosystem: "docker"
    directories: ["/api", "/web"]
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      docker:
        patterns: ["*"]
