name: CI

# Runs the three test suites on every PR and on pushes to the main/working branches.
# Deployment lives in a separate workflow (deploy.yml) that runs only on main.
on:
  push:
    branches: [main, phase-2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: job-autofill/package-lock.json
      - run: npm ci
        working-directory: job-autofill
      - run: npm test
        working-directory: job-autofill

  web:
    name: Web typecheck + lint + build
    runs-on: ubuntu-latest
    env:
      # web/.npmrc pins a Windows cmd.exe script-shell (for the dev's machine); override it
      # here so npm lifecycle scripts work on the Linux runner.
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # web is a workspace member now → install from the ROOT lockfile.
          cache-dependency-path: package-lock.json
      # Workspace-aware install at the repo root (resolves @kiwiply/ui for web).
      - run: npm ci
      - run: npm test --workspace web # sync parser-core + tsc --noEmit + eslint
      - run: npm run build --workspace web # strongest gate: next build (standalone)

  web-docker:
    name: Web Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the production image (root context, workspace-aware) to validate the Dockerfile.
      # No push — this is a smoke check; the real build+push happens in deploy.yml on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          tags: dossier-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api:
    name: API tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Integration tests use Testcontainers; ubuntu-latest ships Docker, so they run as-is.
      - run: chmod +x gradlew && ./gradlew test integrationTest --no-daemon
        working-directory: api
