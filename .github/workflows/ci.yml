name: CI

# Runs the three test suites on every PR and on pushes to the main/working branches.
# Deployment lives in a separate workflow (deploy.yml) that runs only on main.
#
# `develop` is the integration branch: feature work merges there and accumulates until we
# choose to promote it to main. Its commits are as permanent as main's, so it belongs in
# this list — otherwise a merge into develop would get a verdict only from the PR run,
# which tested the merge candidate rather than the merge result.
on:
  push:
    branches: [main, develop, phase-2]
  pull_request:

# Concurrency is deliberately split by event, because the two cases want opposite things.
#
# On a PR, superseding an older commit is the point: nobody needs a verdict on a commit
# that's already been force-pushed past, so those runs share a per-PR group and the older
# one is cancelled for fast feedback.
#
# On a push to main/develop/phase-2, every commit is permanent and needs its own verdict, so the
# group is keyed by SHA — making it unique per commit, so no main run can ever cancel or
# supersede another. `cancel-in-progress: false` alone would NOT achieve this: GitHub still
# cancels a *pending* run when a newer one joins the same group, so merging three PRs in
# quick succession would leave the middle commit with no CI result. That is not theoretical
# — PR #54 and #53 merged 24s apart on 2026-09-19, #54's CI was cancelled, and its commit
# sits in main today with a `cancelled` status.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  extension:
    name: Extension tests (jsdom)
    runs-on: ubuntu-latest
    env:
      # job-autofill/.npmrc pins a Windows cmd.exe script-shell (for the dev's machine). WXT's
      # deps (esbuild) run install scripts, which would try to spawn cmd.exe on this Linux
      # runner — override it so npm ci works.
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # job-autofill is a workspace member now → install from the ROOT lockfile.
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace job-autofill # tsc over the React/TS entrypoints
      - run: npm test --workspace job-autofill

  web:
    name: Web typecheck + lint + build
    runs-on: ubuntu-latest
    env:
      # web/.npmrc pins a Windows cmd.exe script-shell (for the dev's machine); override it
      # here so npm lifecycle scripts work on the Linux runner.
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # web is a workspace member now → install from the ROOT lockfile.
          cache-dependency-path: package-lock.json
      # Workspace-aware install at the repo root (resolves @kiwiply/ui for web).
      - run: npm ci
      - run: npm test --workspace web # sync parser-core + tsc --noEmit + eslint
      - run: node --test scripts/dev/api-local.test.mjs # the local API launcher (I1.14): env-file parsing, names-only logging
      - run: npm run build --workspace web # strongest gate: next build (standalone)

  web-e2e:
    # U19.3: Playwright journeys against `npm run dev:demo` (Next + the mock API, no database): every signed-in
    # route at 390 / 1440 with no console errors or horizontal scroll, and the fresh-account empty states.
    name: Web end-to-end (Playwright on dev:demo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Playwright's own Chromium (the version @playwright/test pins) plus the system libraries it needs.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e --workspace web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  web-docker:
    name: Web Docker image builds + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the production image (root context, workspace-aware) to validate the Dockerfile.
      # No push — this is a smoke check; the real build+push happens in deploy.yml on main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          load: true # load into the runner's Docker so the smoke step can run it
          tags: dossier-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the container
        # Validates the RUNTIME, not just the build: a monorepo-nested standalone with the wrong
        # paths would build fine but fail to start. We need the server to bind AND answer.
        run: |
          docker run -d --name web -p 3000:3000 -e HOSTNAME=0.0.0.0 dossier-web:ci
          ok=
          code=
          for i in $(seq 1 20); do
            # `-w %{http_code}` prints 000 when curl cannot connect, AND curl exits non-zero.
            # So DON'T add `|| echo 000` — that printed a second 000, making "000000", which
            # is != "000" and passed the old check on the very first poll. This job reported
            # success for months without the server ever answering.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/) || code=000
            # Any real status means it bound and routed. 5xx keeps polling: the app is up but
            # broken, and we'd rather fail with that code than call it a pass.
            case "$code" in
              2??|3??|4??) echo "server responded: HTTP $code"; ok=1; break ;;
            esac
            sleep 2
          done
          echo "--- container logs ---"; docker logs web 2>&1 | tail -40
          if [ "$ok" != "1" ]; then
            echo "::error::web container never answered on :3000 (last code: ${code:-none}) — check nested-standalone paths"
            exit 1
          fi

  ops:
    # Phase 15.1: the backup + restore-drill scripts that run on the production box. shellcheck,
    # the helpers and backup-db.sh against a fake docker, then a real dump of a real MySQL (the
    # production version) restored by verify-restore.sh — ubuntu-latest ships Docker.
    name: Ops scripts (backup + restore drill)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x scripts/ops/*.sh scripts/ops/test/*.sh
      - run: REAL_DOCKER=1 scripts/ops/test/ops.test.sh

  # The API suite is ~3,300 unit tests plus ~270 integration classes (Spring + a real MySQL in Testcontainers). Run as one Gradle
  # invocation it ran out of heap around the 11 minute mark and then hit the job timeout (run 39039550528). So it is three things:
  #   api-unit          the unit tests, one JVM, about a minute of test time
  #   api-integration   the integration classes split over 6 parallel jobs (a class's shard is a hash of its name: see the
  #                     `integrationTest` block in api/build.gradle; the 6 shards together run exactly what an unsharded run runs)
  #   api               a gate that keeps the old job name, "API tests (unit + integration)", so a branch-protection rule that
  #                     requires it keeps working: it passes only when the unit job and all six shards passed.
  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon
        working-directory: api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-unit-test-results
          path: api/build/test-results/test/
          retention-days: 7

  api-integration:
    name: API integration tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    # ~45 classes per shard; the compile alone is ~4 minutes. 40 is a ceiling that leaves room for a slow runner, not an expectation.
    timeout-minutes: 40
    strategy:
      # One red shard must not hide the verdict of the others (and a re-run of a failed shard is cheap).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Integration tests use Testcontainers; ubuntu-latest ships Docker, so they run as-is. `-x test`: the unit tests have their own job.
      # -PitHeap: the IT JVM keeps every Spring context it builds, so it gets 3 GB (the hosted runner has 16).
      - run: chmod +x gradlew && ./gradlew integrationTest -x test -PitShard=${{ matrix.shard }}/6 -PitHeap=3g --no-daemon
        working-directory: api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-it-results-shard-${{ matrix.shard }}
          path: |
            api/build/test-results/integrationTest/
            api/build/heapdumps/
          retention-days: 7

  api:
    name: API tests (unit + integration)
    needs: [api-unit, api-integration]
    # always(): when a shard fails this job must still report (as failed), not sit "skipped", or a required check would hang.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the unit job and every integration shard
        run: |
          echo "api-unit: ${{ needs.api-unit.result }}"
          echo "api-integration (all shards): ${{ needs.api-integration.result }}"
          [ "${{ needs.api-unit.result }}" = "success" ] && [ "${{ needs.api-integration.result }}" = "success" ]
