name: Deploy

# On merge to main: build the api + web images, push them to GHCR, then have the VPS pull
# and restart. Building on GitHub's runners keeps the heavy Gradle/npm builds off the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase owner.
  OWNER: hasmika123

jobs:
  build-push:
    name: Build + push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dossier-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dossier-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          # Root context so the web build can sync parser-core from job-autofill/.
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dossier-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dossier-web:${{ github.sha }}
          # Public GA config baked into the client bundle at build time. Measurement ID reuses
          # the GA_MEASUREMENT_ID secret (it's public anyway); the WEB_ANALYTICS_ENABLED variable
          # is the master switch — empty/false keeps analytics dark even with the ID present.
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_ANALYTICS_ENABLED=${{ vars.WEB_ANALYTICS_ENABLED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull + restart on the VPS
    needs: build-push
    runs-on: ubuntu-latest
    # Stays off until the VPS secrets are set and you flip the DEPLOY_ENABLED repo variable
    # to 'true'. Until then, images still build/push above; only the SSH step is skipped.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '~/web-ext-job-application-autofill' }}
            git pull --ff-only
            # Dossier shares a host with another stack, so the shared-edge overlay applies:
            # it keeps our Caddy from starting (the box's edge Caddy owns :80/:443) and puts
            # web + api on the shared web_edge network. See MIGRATION.md §10.
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.shared-edge.yml"
            $COMPOSE pull
            $COMPOSE up -d
            # No Caddy force-recreate here: there is no Dossier Caddy on this host, and the
            # shared edge Caddyfile lives outside this repo (~/beecompete-edge/) so a deploy
            # must never touch it. On a single-tenant host, drop the overlay and restore the
            # force-recreate — the bind-mounted Caddyfile changes inode on git pull.
            docker image prune -f
