# Rotation for the ops scripts' own logs (REAL-GAPS-C P1.5). Install on the box (DEPLOY.md §5.6):
#   sudo install -m 644 scripts/ops/kiwiply-logrotate.conf /etc/logrotate.d/kiwiply
# Own file in logrotate.d, so BeeCompete's rotation config is never touched. The containers'
# logs are capped separately, by the `logging:` block in docker-compose.prod.yml.
/var/log/kiwiply-backup.log /var/log/kiwiply-backup-uploads.log /var/log/kiwiply-restore-drill.log /var/log/kiwiply-host-guard.log {
    weekly
    rotate 8
    maxsize 20M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}
