<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brandlock">
        <span class="kmark"></span>
        <span class="wm"><span class="k">kiwi</span>ply</span>
      </div>
      <button class="link" id="manage">Manage</button>
    </header>

    <div id="bio-warn" class="warn hidden">Add your bio to start filling — open Manage →</div>

    <label class="lbl" for="resume">Resume variant</label>
    <select id="resume" class="select"></select>

    <div class="meta" id="meta"></div>

    <label class="check"><input type="checkbox" id="eeo" /> Include EEO / demographic answers</label>
    <label class="check"><input type="checkbox" id="autoadv" /> Auto-advance to next step after filling</label>

    <button id="fill" class="primary">Scan &amp; fill this page</button>
    <button id="savejob" class="ghost">Save this job</button>
    <div class="status" id="status"></div>
    <div class="foot">Reviews before filling · never clicks Submit</div>
  </div>
  <script src="../lib/schema.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/tracking.js"></script>
  <script src="popup.js"></script>
</body>
</html>
