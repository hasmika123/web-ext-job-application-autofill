<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <img class="brandimg" src="../../icons/logo.png" alt="Kiwiply" />
      <div class="headlinks">
        <button class="link" id="manage" title="Manage your profile & resumes on kiwiply.com">Manage</button>
        <button class="link" id="settings-link" title="Extension settings">Settings</button>
      </div>
    </header>

    <div id="bio-warn" class="warn hidden">Connect the extension & build your profile on kiwiply.com →</div>

    <label class="lbl" for="resume">Resume variant</label>
    <select id="resume" class="select"></select>

    <div class="meta" id="meta"></div>

    <label class="check"><input type="checkbox" id="eeo" /> Include EEO / demographic answers</label>
    <label class="check"><input type="checkbox" id="autoadv" /> Auto-advance to next step after filling</label>

    <button id="fill" class="primary">Scan &amp; fill this page</button>
    <button id="savejob" class="ghost">Save this job</button>
    <div class="status" id="status"></div>
    <div class="foot">Reviews before filling · never clicks Submit</div>
  </div>
  <script src="../lib/schema.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/tracking.js"></script>
  <script src="../lib/sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
