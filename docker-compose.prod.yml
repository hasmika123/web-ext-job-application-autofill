# Production stack for a single Docker host (the VPS): MySQL + API + web, fronted by Caddy
# which terminates TLS (Let's Encrypt) and routes by hostname. All app traffic is internal;
# only Caddy publishes ports (80/443). Secrets come from a sibling .env file (see
# .env.example) — nothing sensitive is baked into the images.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
name: dossier

services:
  mysql:
    image: mysql:9.2.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=dossierApi
    # lower_case_table_names=1 must be set at first init — matches dev so the schema/table
    # names line up regardless of the DB name's casing.
    command: mysqld --lower_case_table_names=1 --skip-mysqlx --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]

  api:
    # CI builds + pushes this image to GHCR; the VPS pulls it (`docker compose pull`). The
    # `build:` block still works for a local/manual `up -d --build` (it tags the same name).
    image: ghcr.io/hasmika123/dossier-api:latest
    build:
      context: ./api
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/dossierApi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?}
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_BASE64_SECRET:?set JWT_BASE64_SECRET in .env}
      # "Sign in with Google": the OAuth client id we require as the ID-token audience.
      # NOT a secret (it ships in the web bundle too); defaulted here so it works without a
      # .env entry, overridable via GOOGLE_CLIENT_ID. Empty ⇒ Google sign-in returns 503.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-482405713424-qtq3seoa0d8bg0e26f2bpisnqvjgt15o.apps.googleusercontent.com}
      # AWS S3 (private bucket). Endpoint stays empty so the SDK uses the default AWS
      # endpoint for the region.
      - DOSSIER_STORAGE_REGION=${S3_REGION:-us-east-1}
      - DOSSIER_STORAGE_BUCKET=${S3_BUCKET:?set S3_BUCKET in .env}
      - DOSSIER_STORAGE_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      - DOSSIER_STORAGE_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      - DOSSIER_STORAGE_PATH_STYLE_ACCESS=false
      # CORS is for the browser extension's direct calls. Set to the published extension id
      # at launch, e.g. chrome-extension://<id>.
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-chrome-extension://*}
      # Email verification (Brevo SMTP). Activation links point at the canonical web app
      # (https://<SSLIP_HOST> — SSLIP_HOST holds the base host; prod = kiwiply.com).
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_BASE_URL=${MAIL_BASE_URL:-https://${SSLIP_HOST}}
      # Server-side metered AI drafting (Phase 5.1). OFF unless DOSSIER_AI_ENABLED=true AND a
      # key is set. The key stays here (server) — never in the extension. Gemini FREE tier may
      # use inputs to improve Google's services (the extension keeps this opt-in + disclosed).
      - DOSSIER_AI_ENABLED=${DOSSIER_AI_ENABLED:-false}
      - DOSSIER_AI_PROVIDER=${DOSSIER_AI_PROVIDER:-gemini}
      - DOSSIER_AI_MODEL=${DOSSIER_AI_MODEL:-gemini-2.0-flash}
      - DOSSIER_AI_API_KEY=${DOSSIER_AI_API_KEY:-}
      - DOSSIER_AI_FREE_MONTHLY_QUOTA=${DOSSIER_AI_FREE_MONTHLY_QUOTA:-50}
      - DOSSIER_AI_PARSE_MAX_OUTPUT_TOKENS=${DOSSIER_AI_PARSE_MAX_OUTPUT_TOKENS:-4000}
      # Real admin, created/promoted from env at startup (Phase 9.A0). ADMIN_PASSWORD_HASH is a
      # BCRYPT hash, not a plaintext password — nothing is committed. Blank ⇒ no admin bootstrap.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-admin}
      # Email-OTP MFA for admin sign-in (Phase 9.X.3). OFF by default; enable only once admin email
      # delivery is confirmed (the code is emailed). Recover by setting back to false + recreate.
      - ADMIN_MFA_ENABLED=${ADMIN_MFA_ENABLED:-false}
      # Newsletter: Brevo Contacts API sync (off unless both set) + postal address for campaign emails.
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_LIST_ID=${BREVO_LIST_ID:-0}
      - NEWSLETTER_POSTAL_ADDRESS=${NEWSLETTER_POSTAL_ADDRESS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  web:
    image: ghcr.io/hasmika123/dossier-web:latest
    build:
      # Root context: the web build syncs the shared parser-core from job-autofill/.
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      # Server-side only: the web's Next route handlers call the API over the internal
      # network. The browser never hits this URL directly.
      - DOSSIER_API_URL=http://api:8080
    depends_on:
      - api
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. SSLIP_HOST=203-0-113-5.sslip.io  → app.<host> and api.<host> resolve to this IP
      - SSLIP_HOST=${SSLIP_HOST:?set SSLIP_HOST in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  internal:
