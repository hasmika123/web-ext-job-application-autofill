# Production stack for a single Docker host (the VPS): MySQL + API + web, fronted by Caddy
# which terminates TLS (Let's Encrypt) and routes by hostname. All app traffic is internal;
# only Caddy publishes ports (80/443). Secrets come from a sibling .env file (see
# .env.example) — nothing sensitive is baked into the images.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
name: dossier

services:
  mysql:
    image: mysql:9.2.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=dossierApi
    # lower_case_table_names=1 must be set at first init — matches dev so the schema/table
    # names line up regardless of the DB name's casing.
    command: mysqld --lower_case_table_names=1 --skip-mysqlx --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]

  api:
    # CI builds + pushes this image to GHCR; the VPS pulls it (`docker compose pull`). The
    # `build:` block still works for a local/manual `up -d --build` (it tags the same name).
    image: ghcr.io/hasmika123/dossier-api:latest
    build:
      context: ./api
    restart: unless-stopped
    volumes:
      # User files (resumes, attachments, built-resume PDFs). This is user data: it is NOT in the
      # MySQL dump, so back this volume up separately and never `docker compose down -v`.
      - uploads:/srv/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/dossierApi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?}
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_BASE64_SECRET:?set JWT_BASE64_SECRET in .env}
      # "Sign in with Google": the OAuth client id we require as the ID-token audience.
      # NOT a secret (it ships in the web bundle too); defaulted here so it works without a
      # .env entry, overridable via GOOGLE_CLIENT_ID. Empty ⇒ Google sign-in returns 503.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-482405713424-qtq3seoa0d8bg0e26f2bpisnqvjgt15o.apps.googleusercontent.com}
      # File storage (FileStorage seam). Default driver = local disk on the `uploads` volume, so
      # no cloud account or credentials are needed. To switch to AWS S3 later, set
      # DOSSIER_STORAGE_DRIVER=s3 in .env together with the S3_* values below (config only).
      - DOSSIER_STORAGE_DRIVER=${DOSSIER_STORAGE_DRIVER:-local}
      - DOSSIER_STORAGE_LOCAL_ROOT=/srv/uploads
      # Only used when the driver is s3 (blank otherwise). Endpoint stays empty so the SDK uses
      # the default AWS endpoint for the region.
      - DOSSIER_STORAGE_REGION=${S3_REGION:-us-east-1}
      - DOSSIER_STORAGE_BUCKET=${S3_BUCKET:-dossier-resumes}
      - DOSSIER_STORAGE_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - DOSSIER_STORAGE_SECRET_KEY=${S3_SECRET_KEY:-}
      - DOSSIER_STORAGE_PATH_STYLE_ACCESS=false
      # CORS is for the browser extension's direct calls. Set to the published extension id
      # at launch, e.g. chrome-extension://<id>.
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-chrome-extension://*}
      # Email verification (Brevo SMTP). Activation links point at the canonical web app
      # (https://<SSLIP_HOST> — SSLIP_HOST holds the base host; prod = kiwiply.com).
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_BASE_URL=${MAIL_BASE_URL:-https://${SSLIP_HOST}}
      # Server-side metered AI drafting (Phase 5.1). OFF unless DOSSIER_AI_ENABLED=true AND a
      # key is set. The key stays here (server) — never in the extension. Gemini FREE tier may
      # use inputs to improve Google's services (the extension keeps this opt-in + disclosed).
      - DOSSIER_AI_ENABLED=${DOSSIER_AI_ENABLED:-false}
      - DOSSIER_AI_PROVIDER=${DOSSIER_AI_PROVIDER:-gemini}
      # 13.1a: the fallback was gemini-2.0-flash, which returned limit:0 — the app's own default
      # is Flash-Lite, and this now agrees with it. The three lines after the key were never
      # passed through before, so .env values for them were silently ignored.
      - DOSSIER_AI_MODEL=${DOSSIER_AI_MODEL:-gemini-2.5-flash-lite}
      - DOSSIER_AI_API_KEY=${DOSSIER_AI_API_KEY:-}
      - DOSSIER_AI_BASE_URL=${DOSSIER_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - DOSSIER_AI_FREE_MONTHLY_QUOTA=${DOSSIER_AI_FREE_MONTHLY_QUOTA:-50}
      # 13.1b — Pro is metered by cost, not call count (AiPolicy). Unset = the defaults in
      # application-prod.yml; per-task models are optional (blank = DOSSIER_AI_MODEL).
      - DOSSIER_AI_PRO_MONTHLY_BUDGET_USD=${DOSSIER_AI_PRO_MONTHLY_BUDGET_USD:-3.0}
      - DOSSIER_AI_PRO_3MO_BUDGET_USD=${DOSSIER_AI_PRO_3MO_BUDGET_USD:-8.0}
      - DOSSIER_AI_SOFT_CAP_PERCENT=${DOSSIER_AI_SOFT_CAP_PERCENT:-80}
      - DOSSIER_AI_ECONOMY_MODEL=${DOSSIER_AI_ECONOMY_MODEL:-}
      - DOSSIER_AI_DISABLED_TASKS=${DOSSIER_AI_DISABLED_TASKS:-}
      - DOSSIER_AI_MODEL_DRAFT=${DOSSIER_AI_MODEL_DRAFT:-}
      - DOSSIER_AI_MODEL_PICK=${DOSSIER_AI_MODEL_PICK:-}
      - DOSSIER_AI_MODEL_MAP=${DOSSIER_AI_MODEL_MAP:-}
      - DOSSIER_AI_MODEL_ENRICH=${DOSSIER_AI_MODEL_ENRICH:-}
      - DOSSIER_AI_MODEL_PARSE=${DOSSIER_AI_MODEL_PARSE:-}
      - DOSSIER_AI_MODEL_MATCH=${DOSSIER_AI_MODEL_MATCH:-}
      - DOSSIER_AI_MODEL_FIT=${DOSSIER_AI_MODEL_FIT:-}
      - DOSSIER_AI_MODEL_TAILOR=${DOSSIER_AI_MODEL_TAILOR:-}
      - DOSSIER_AI_MODEL_JOBS=${DOSSIER_AI_MODEL_JOBS:-}
      - DOSSIER_AI_MODEL_INBOX=${DOSSIER_AI_MODEL_INBOX:-}
      - DOSSIER_AI_MODEL_REWRITE=${DOSSIER_AI_MODEL_REWRITE:-}
      - DOSSIER_AI_MODEL_SUMMARY=${DOSSIER_AI_MODEL_SUMMARY:-}
      - DOSSIER_AI_MODEL_SUGGEST=${DOSSIER_AI_MODEL_SUGGEST:-}
      - DOSSIER_AI_MODEL_COVER=${DOSSIER_AI_MODEL_COVER:-}
      - DOSSIER_AI_MODEL_TRANSLATE=${DOSSIER_AI_MODEL_TRANSLATE:-}
      - DOSSIER_AI_MAX_OUTPUT_TOKENS=${DOSSIER_AI_MAX_OUTPUT_TOKENS:-400}
      - DOSSIER_AI_PARSE_MAX_OUTPUT_TOKENS=${DOSSIER_AI_PARSE_MAX_OUTPUT_TOKENS:-4000}
      # Nightly job-board read for daily job matches (13.6a). On unless set to false.
      - DOSSIER_JOBS_ENABLED=${DOSSIER_JOBS_ENABLED:-true}
      - DOSSIER_JOBS_FETCH_CRON=${DOSSIER_JOBS_FETCH_CRON:-0 0 2 * * *}
      - DOSSIER_JOBS_MATCH_CRON=${DOSSIER_JOBS_MATCH_CRON:-0 0 4 * * *}
      # Service-to-service secret for /api/internal/** (the web's resume-PDF worker, Resume Builder R3.7).
      # The SAME value is set on the web service below. Blank = the internal routes refuse everything
      # and no PDF is generated in the background (manual "Export PDF" still works). Only in the box's .env.
      - DOSSIER_INTERNAL_TOKEN=${DOSSIER_INTERNAL_TOKEN:-}
      # Enterprise V2 tenant hosts: the web server proves it is the web server with this secret (same value on the web
      # service). The prod profile REQUIRES it: blank = no X-Kiwiply-Host is believed, so no tenant host resolves.
      - DOSSIER_TENANT_HOST_SECRET=${DOSSIER_TENANT_HOST_SECRET:-}
      # Inbox encryption key (14.2). Lives only in the box's .env and the password manager.
      - DOSSIER_INBOX_KEY=${DOSSIER_INBOX_KEY:-}
      - DOSSIER_INBOX_KEY_VERSION=${DOSSIER_INBOX_KEY_VERSION:-1}
      - DOSSIER_INBOX_POLL_CRON=${DOSSIER_INBOX_POLL_CRON:-0 */15 * * * *}
      - DOSSIER_INBOX_BACKFILL_DAYS=${DOSSIER_INBOX_BACKFILL_DAYS:-60}
      # Server-error email digest (15.1b). Blank = ADMIN_EMAIL gets it; no ADMIN_EMAIL = off.
      - DOSSIER_ERROR_DIGEST_TO=${DOSSIER_ERROR_DIGEST_TO:-}
      - DOSSIER_OPS_ERROR_DIGEST_IGNORE_LOGGERS=${DOSSIER_OPS_ERROR_DIGEST_IGNORE_LOGGERS:-}
      # Billing (Phase 12). Blank STRIPE_SECRET_KEY = billing disabled, which is a valid
      # running state — the API starts and serves everything else normally.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY:-}
      - STRIPE_PRICE_3MO=${STRIPE_PRICE_3MO:-}
      # Real admin, created/promoted from env at startup (Phase 9.A0). ADMIN_PASSWORD_HASH is a
      # BCRYPT hash, not a plaintext password — nothing is committed. Blank ⇒ no admin bootstrap.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-admin}
      # Demo accounts (phase demo). DEMO_ENABLED is THE on/off switch (default false; change + recreate the
      # api container). DEMO_PASSWORD: the stored password of the two demo users; blank = a random one per
      # boot, so only the one-click login works.
      - DEMO_ENABLED=${DEMO_ENABLED:-false}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      # Demo sandbox: nightly reset cron (UTC; set DEMO_RESET_CRON= to empty to turn it off) and the daily AI-call cap per demo account.
      - DEMO_RESET_CRON=${DEMO_RESET_CRON-0 0 4 * * *}
      - DEMO_AI_CALLS_PER_DAY=${DEMO_AI_CALLS_PER_DAY:-10}
      # Organization features (E2E-O1.9): OFF in production (default false). An admin-stored
      # `feature.orgs.enabled` setting overrides this; while off, /api/orgs/** answers 404.
      - ORGS_ENABLED=${ORGS_ENABLED:-false}
      # Email-OTP MFA for admin sign-in (Phase 9.X.3). OFF by default; enable only once admin email
      # delivery is confirmed (the code is emailed). Recover by setting back to false + recreate.
      - ADMIN_MFA_ENABLED=${ADMIN_MFA_ENABLED:-false}
      # Newsletter: Brevo Contacts API sync (off unless both set) + postal address for campaign emails.
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_LIST_ID=${BREVO_LIST_ID:-0}
      - NEWSLETTER_POSTAL_ADDRESS=${NEWSLETTER_POSTAL_ADDRESS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  web:
    image: ghcr.io/hasmika123/dossier-web:latest
    build:
      # Root context: the web build syncs the shared parser-core from job-autofill/.
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      # Server-side only: the web's Next route handlers call the API over the internal
      # network. The browser never hits this URL directly.
      - DOSSIER_API_URL=http://api:8080
      # Enterprise V2 tenant hosts (same secret as the api service). TRUST_PROXY_HOST=true: this container sits behind the
      # shared edge Caddy, which sets X-Forwarded-Host. PLATFORM_HOSTS adds staging/preview hosts to the web's platform fast path.
      - DOSSIER_TENANT_HOST_SECRET=${DOSSIER_TENANT_HOST_SECRET:-}
      - TRUST_PROXY_HOST=${TRUST_PROXY_HOST:-true}
      - PLATFORM_HOSTS=${PLATFORM_HOSTS:-}
      # PDF export (Resume Builder R0.6): the web prints resumes in the `chromium` sidecar below.
      # No depends_on on purpose: if the sidecar is down the site keeps running and "Export PDF"
      # answers 503 "needs the pdf service". The knobs are the future admin settings
      # resume.pdf.timeoutMs / maxConcurrent / queueMax / maxFitSteps; defaults are the safe ones.
      - PDF_BROWSER_URL=${PDF_BROWSER_URL:-ws://chromium:3000}
      - RESUME_PDF_TIMEOUT_MS=${RESUME_PDF_TIMEOUT_MS:-20000}
      - RESUME_PDF_MAX_CONCURRENT=${RESUME_PDF_MAX_CONCURRENT:-1}
      - RESUME_PDF_QUEUE_MAX=${RESUME_PDF_QUEUE_MAX:-10}
      - RESUME_PDF_MAX_FIT_STEPS=${RESUME_PDF_MAX_FIT_STEPS:-3}
      # Patience for a COLD sidecar (its first Chromium launch after a restart/idle takes ~14 s, not ~1.3 s) and warm-up on boot.
      - RESUME_PDF_CONNECT_TIMEOUT_MS=${RESUME_PDF_CONNECT_TIMEOUT_MS:-30000}
      - RESUME_PDF_CONNECT_ATTEMPTS=${RESUME_PDF_CONNECT_ATTEMPTS:-5}
      - RESUME_PDF_CONNECT_BACKOFF_MS=${RESUME_PDF_CONNECT_BACKOFF_MS:-500}
      - RESUME_PDF_CONNECT_BUDGET_MS=${RESUME_PDF_CONNECT_BUDGET_MS:-60000}
      - RESUME_PDF_WARMUP=${RESUME_PDF_WARMUP:-1}
      # Async PDF worker (Resume Builder R3.7): this container polls the API's /api/internal queue and
      # renders the PDFs that saves leave pending. EXACTLY ONE web container sets RESUME_PDF_WORKER=1
      # (several would be safe - claims are leased - but only waste Chromium time). It needs the same
      # DOSSIER_INTERNAL_TOKEN as the api service; without it the worker logs an error and does not start.
      - RESUME_PDF_WORKER=${RESUME_PDF_WORKER:-1}
      - DOSSIER_INTERNAL_TOKEN=${DOSSIER_INTERNAL_TOKEN:-}
    depends_on:
      - api
    networks: [internal]

  # Headless Chromium that prints the resume HTML to PDF (R0.6). INTERNAL NETWORK ONLY: no
  # `ports:`, and it is deliberately NOT in docker-compose.shared-edge.yml, so neither this stack's
  # Caddy nor the shared edge can route to it - only the web container talks to it
  # (ws://chromium:3000). Pinned by version AND digest (the multi-arch index digest of v2.57.0);
  # bump both together and re-run the "PDF service" checks in DEPLOY.md.
  chromium:
    image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
    restart: unless-stopped
    init: true
    # Shared box (BeeCompete lives here too): cap it. ~260 MB idle-after-print in testing; a
    # print of a long resume peaks well under 1 GB. /dev/shm must be larger than Docker's 64 MB
    # default or Chromium crashes on big pages.
    mem_limit: 1g
    cpus: 1.5
    shm_size: 512m
    environment:
      # browserless' own admission control, a second wall behind the web's queue (1 + 10).
      - CONCURRENT=2
      - QUEUED=4
      - TIMEOUT=30000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/pressure >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. SSLIP_HOST=203-0-113-5.sslip.io  → app.<host> and api.<host> resolve to this IP
      - SSLIP_HOST=${SSLIP_HOST:?set SSLIP_HOST in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
