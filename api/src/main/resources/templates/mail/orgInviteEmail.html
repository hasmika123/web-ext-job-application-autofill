<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="${subject}">Invite</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #232826; line-height: 1.5">
    <p th:if="${name != null}" th:text="#{email.invite.greeting(${name})}">Hi Sam,</p>
    <p th:unless="${name != null}" th:text="#{email.invite.greeting.anon}">Hi there,</p>
    <p th:text="#{email.invite.text1(${inviter}, ${org}, ${role})}">Priya invited you to join Acme on Kiwiply as a member.</p>
    <p th:text="#{email.invite.keep(${org})}">You keep your own account.</p>
    <p th:if="${!pays.isEmpty()}" th:text="#{email.invite.pays(${org}, ${paysList})}">Acme pays for: Pro.</p>
    <p>
      <a th:href="${link}" th:text="#{email.invite.button(${org})}" style="display: inline-block; padding: 10px 18px; border-radius: 10px; background: #4c7a1f; color: #ffffff; font-weight: 600; text-decoration: none">Join Acme</a>
    </p>
    <p style="color: #6b726e; font-size: 13px" th:text="#{email.invite.expires(${expires})}">This link works until 1 Jan.</p>
    <p style="color: #6b726e; font-size: 13px" th:text="#{email.invite.notyou}">Not you? Ignore this email.</p>
    <p><em th:text="#{email.signature}">Kiwiply Team.</em></p>
  </body>
</html>
