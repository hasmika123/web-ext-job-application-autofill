<!doctype html>
<!--
  Password reset e-mail of an ENTERPRISE account (X2.10): the organization's look (name or logo header, brand colour), "this workspace" wording, the
  footer linking only to the organization's own policy pages (policyBase), never to kiwiply.com. Personal accounts keep passwordResetEmail.html.
  Model: user (resetKey), name, baseUrl (the organization host), orgName, subject, theme, brand, logoUrl, assetBase, policyBase (nullable).
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <title th:text="${subject}">Reset your password</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
  </head>
  <body style="margin: 0; padding: 0">
    <div th:replace="~{mail/fragments :: preheader(#{email.ent.reset.preheader(${orgName})})}"></div>
    <th:block th:with="accent=${brand} ?: '#0d63e8', btnText='#ffffff', heroBg='#eaf3fd', url=(@{|${baseUrl}/reset-password?key=${user.resetKey}|})">
      <th:block th:replace="~{mail/fragments :: shell('enterprise', ${brand}, ${logoUrl}, ${orgName}, ${assetBase}, ~{::section})}">
        <section>
          <table th:replace="~{mail/fragments :: heroCentered(${heroBg}, ${assetBase} + '/ent-hero-shield.png', #{email.adminreset.title2(${orgName})}, '#0b2a52', #{email.ent.reset.intro(${orgName})}, ${url}, #{email.kw.reset.button}, ${accent}, ${btnText})}"></table>
          <table th:replace="~{mail/fragments :: strip('#e7f3ee', #{email.ent.reset.strip.title}, #{email.ent.reset.strip.text})}"></table>
          <p style="margin: 0; padding: 12px 28px 18px 28px; font-size: 12px; color: #6b726e" th:text="#{email.ent.reset.notyou}">Did not ask for this? Ignore this e-mail or tell your administrator.</p>
        </section>
      </th:block>
    </th:block>
  </body>
</html>
