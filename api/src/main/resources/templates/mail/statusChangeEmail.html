<!doctype html>
<!--
  Interview / offer e-mail (personal Kiwiply, green theme): an application moved to Interview or Offer on the user's board.
  Model (unchanged): subject, name, company, role, stage (OFFER or INTERVIEW), link. Optional: assetBase (art folder, default https://kiwiply.com/email).
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="${subject}">Interview invite</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
  </head>
  <body style="margin: 0; padding: 0">
    <th:block th:with="offer=${stage == 'OFFER'}, art=${assetBase} ?: 'https://kiwiply.com/email', accent='#5cc21f', btnText='#0b2a12', accentText='#2f7d12', heroBg='#eaf6e3', stripBg='#eaf6e3'">
      <div th:replace="~{mail/fragments :: preheader(${offer} ? #{email.kw.status.pre.offer(${company})} : #{email.kw.status.pre.interview(${company})})}"></div>
      <th:block th:replace="~{mail/fragments :: shell('kiwiply', null, null, null, ${art}, ~{::section})}">
        <section>
          <table th:replace="~{mail/fragments :: hero(${heroBg}, ${art} + '/kiwi-hero-active.png', 230, ${offer} ? #{email.kw.status.kicker.offer} : #{email.kw.status.kicker.interview}, #{email.kw.status.l1}, ${offer} ? #{email.kw.status.l2.offer} : #{email.kw.status.l2.interview}, ${accentText}, ${offer} ? #{email.kw.status.intro.offer(${name}, ${company}, ${role})} : #{email.kw.status.intro.interview(${name}, ${company}, ${role})}, ${link}, #{email.status.link}, ${accent}, ${btnText})}"></table>
          <table th:replace="~{mail/fragments :: strip(${stripBg}, ${role}, #{email.kw.status.card.text(${company}, ${offer} ? #{email.kw.status.stage.offer} : #{email.kw.status.stage.interview})})}"></table>
          <p style="margin: 0; padding: 14px 28px 4px 28px; font-size: 14px; line-height: 1.5; color: #232826" th:text="#{email.status.check}">Read the original email.</p>
          <p style="margin: 0; padding: 8px 28px 18px 28px; font-size: 12px; line-height: 1.5; color: #6b726e" th:text="#{email.status.footer}">Footer</p>
        </section>
      </th:block>
    </th:block>
  </body>
</html>
