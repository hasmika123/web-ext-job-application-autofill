<!doctype html>
<!--
  Account created for you (set your password) e-mail (personal Kiwiply, green theme). Model (unchanged from the plain version): user (login, resetKey), baseUrl.
  Optional: assetBase (art folder; defaults to baseUrl + /email), helpUrl/privacyUrl/termsUrl.
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.activation.title}">Kiwiply</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
  </head>
  <body style="margin: 0; padding: 0">
    <div th:replace="~{mail/fragments :: preheader(#{email.kw.creation.pre})}"></div>
    <th:block th:with="art=${assetBase} ?: (${baseUrl} + '/email'), accent='#5cc21f', btnText='#0b2a12', accentText='#2f7d12', heroBg='#eaf6e3', stripBg='#eaf6e3', pillBg='#e6f5dc', pillText='#1f5d0a', url=(@{|${baseUrl}/reset-password?key=${user.resetKey}|})">
      <th:block th:replace="~{mail/fragments :: shell('kiwiply', null, null, null, ${art}, ~{::section})}">
        <section>
          <table th:replace="~{mail/fragments :: hero(${heroBg}, ${art} + '/kiwi-hero-active.png', 230, #{email.kw.creation.kicker}, #{email.kw.creation.l1}, #{email.kw.creation.l2}, ${accentText}, #{email.kw.creation.intro}, ${url}, #{email.kw.creation.button}, ${accent}, ${btnText})}"></table>
          <table th:replace="~{mail/fragments :: strip(${stripBg}, #{email.kw.creation.strip.title}, #{email.kw.creation.strip.text})}"></table>
          <table th:replace="~{mail/fragments :: row(${art} + '/kiwi-active-row1.png', #{email.kw.row0.title}, #{email.kw.row0.text}, ${baseUrl}, #{email.kw.row0.label}, ${pillBg}, ${pillText})}"></table>
          <table th:replace="~{mail/fragments :: row(${art} + '/kiwi-active-row2.png', #{email.kw.row1.title}, #{email.kw.row1.text}, ${baseUrl}, #{email.kw.row1.label}, ${pillBg}, ${pillText})}"></table>
          <table th:replace="~{mail/fragments :: row(${art} + '/kiwi-active-row3.png', #{email.kw.row4.title}, #{email.kw.row4.text}, ${baseUrl}, #{email.kw.row4.label}, ${pillBg}, ${pillText})}"></table>
          <table th:replace="~{mail/fragments :: support('#eaf6e3', ${art} + '/kiwi-support.png', #{email.kw.support.title}, #{email.kw.support.text}, ${baseUrl}, #{email.kw.support.label}, ${accent}, ${btnText})}"></table>
          <p style="margin: 0; padding: 12px 28px 18px 28px; font-size: 12px; color: #6b726e" th:text="#{email.kw.creation.notyou}">Not you? Ignore this e-mail.</p>
        </section>
      </th:block>
    </th:block>
  </body>
</html>
