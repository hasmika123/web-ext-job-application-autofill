<!doctype html>
<!--
  "Your password was reset by an administrator" - sent when an Org Admin or the app admin issues a new temporary password.
  Like accountCreatedEmail it never carries the password. Model: subject, theme, name, orgName, actorName, signInUrl,
  expires, brand, logoUrl, assetBase (optional ones as there).
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <title th:text="${subject}">Password reset</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
  </head>
  <body style="margin: 0; padding: 0">
    <div th:replace="~{mail/fragments :: preheader(#{email.adminreset.preheader(${orgName})})}"></div>
    <th:block th:with="accent=${brand} ?: '#0d63e8', btnText='#ffffff', heroBg='#eaf3fd'">
      <th:block th:replace="~{mail/fragments :: shell(${theme} ?: 'enterprise', ${brand}, ${logoUrl}, ${orgName}, ${assetBase}, ~{::section})}">
        <section>
          <table th:replace="~{mail/fragments :: hero(${heroBg}, ${assetBase} + '/ent-hero-welcome.png', 250, #{email.adminreset.kicker}, #{email.adminreset.hero1}, #{email.adminreset.hero2}, ${accent}, #{email.adminreset.text(${actorName}, ${orgName})}, ${signInUrl}, #{email.created.button}, ${accent}, ${btnText})}"></table>
          <table th:replace="~{mail/fragments :: strip('#e7f3ee', #{email.adminreset.strip.title}, #{email.created.strip.text(${expires})})}"></table>
          <table th:replace="~{mail/fragments :: row(${assetBase} + '/ent-row1.png', #{email.adminreset.r1.title}, #{email.adminreset.r1.text}, ${signInUrl}, #{email.created.button}, '#e6f0fe', ${accent})}"></table>
          <p style="margin: 0; padding: 12px 28px 18px 28px; font-size: 12px; color: #6b726e" th:text="#{email.adminreset.notyou}">Did not ask for this? Tell your administrator right away.</p>
        </section>
      </th:block>
    </th:block>
  </body>
</html>
