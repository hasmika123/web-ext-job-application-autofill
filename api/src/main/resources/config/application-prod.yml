# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.dossier.api: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: false

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/dossierApi?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
    username: root
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: prod
  mail:
    # SMTP for verification emails (Brevo now; provider-agnostic — just env). Defaults keep
    # the app booting with no mail configured (send simply fails, logged async).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias dossierapi -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  shutdown: graceful # see https://docs.spring.io/spring-boot/docs/current/reference/html/spring-boot-features.html#boot-features-graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  # CORS is needed for the BROWSER EXTENSION, which calls the API directly from its
  # chrome-extension:// origin. The web app does NOT need CORS (its browser only talks to
  # its own Next route handlers, which proxy to the API server-side). Override the pattern
  # with the published extension id at launch (e.g. chrome-extension://<id>).
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:chrome-extension://*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count'
    allow-credentials: true
    max-age: 1800
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 1000 # Number of objects in each cache entry
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        # As this is the PRODUCTION configuration, the secret has NO default here: prod must
        # supply it via the JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET environment
        # variable (generate one with `openssl rand -base64 64`). The app fails fast on boot
        # if it's missing, so prod can never silently run on a shared/committed key.
        base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET}
        # Access token is short-lived (15 min); refresh token is long-lived (90 days).
        # The web app silently rotates the refresh token (proxy.ts) on a rolling window,
        # so this is the max idle time before a re-login is required.
        token-validity-in-seconds: 900
        token-validity-in-seconds-for-remember-me: 7776000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    # base-url is the WEB app URL — the activation link in the email points to
    # ${base-url}/account/activate?key=… (the Next page below), not the API.
    base-url: ${MAIL_BASE_URL:http://localhost:3000}
    from: ${MAIL_FROM:no-reply@localhost} # must be your Brevo-verified sender address
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

# ===================================================================
# Dossier application properties (prod)
# ===================================================================
dossier:
  storage:
    # AWS S3 (private bucket). Leave the endpoint EMPTY so the SDK uses the default AWS
    # endpoint for the region; set it only for an S3-compatible store (MinIO/R2). region,
    # bucket and credentials come from the environment. path-style-access is FALSE for AWS
    # S3 (virtual-hosted style); it's a MinIO/R2 thing.
    endpoint: ${DOSSIER_STORAGE_ENDPOINT:}
    region: ${DOSSIER_STORAGE_REGION:us-east-1}
    bucket: ${DOSSIER_STORAGE_BUCKET:dossier-resumes}
    access-key: ${DOSSIER_STORAGE_ACCESS_KEY:}
    secret-key: ${DOSSIER_STORAGE_SECRET_KEY:}
    path-style-access: ${DOSSIER_STORAGE_PATH_STYLE_ACCESS:false}
  ai:
    # Server-side metered AI answer drafting (Phase 5.1). OFF unless enabled AND a key
    # is set. Provider-agnostic: switch provider/model/baseUrl without code changes.
    # The key lives here (env) only — it never ships in the extension bundle.
    # Gemini FREE-tier note: Google may use inputs to improve its services, so the
    # extension keeps this OPT-IN and the privacy policy discloses it. Switch to a paid
    # key (or another provider) to remove that data-use caveat.
    enabled: ${DOSSIER_AI_ENABLED:false}
    provider: ${DOSSIER_AI_PROVIDER:gemini}
    base-url: ${DOSSIER_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${DOSSIER_AI_MODEL:gemini-2.5-flash-lite}
    api-key: ${DOSSIER_AI_API_KEY:}
    free-monthly-quota: ${DOSSIER_AI_FREE_MONTHLY_QUOTA:50}
    max-output-tokens: ${DOSSIER_AI_MAX_OUTPUT_TOKENS:400}
