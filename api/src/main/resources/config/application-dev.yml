# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.dossier.api: DEBUG

spring:
  docker:
    compose:
      enabled: false
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/dossierApi?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
    username: root
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  liquibase:
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: dev, faker
  mail:
    host: localhost
    port: 25
    username:
    password:
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 100 # Number of objects in each cache entry
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100'
    # githubpreview.dev for Codespaces; chrome-extension://* so the Dossier
    # extension (its origin varies per install) can call the API in local dev.
    allowed-origin-patterns: 'https://*.githubpreview.dev,chrome-extension://*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: ZDVkZmU2NmRmZWZhZGRhZWZlYjJiNTgzNGE3NDYwODYzMDBkMzE3NDkyNzRjOGI2ZGJlNDY2NDgyMTRjYzM3MzZlMjNmYjhjNjM1ZmI5MmY0ODlhNDg3Yjc5NmI5MGRmZGRkZjM2ZmNhZjQwYzA0MzNlMThmNTJjODgzYjgyYTQ=
        # Access token is short-lived (15 min); refresh token is long-lived (90 days).
        # The web app silently rotates the refresh token (proxy.ts) on a rolling window,
        # so this is the max idle time before a re-login is required.
        token-validity-in-seconds: 900
        token-validity-in-seconds-for-remember-me: 7776000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://127.0.0.1:8080
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

dossier:
  # Billing (Phase 12). Blank secret key = billing disabled, which is the normal local state:
  # the API starts, /api/billing/me reports FREE + billingEnabled:false, and checkout/portal
  # return 503 BILLING_DISABLED. To work on billing locally, export these from your Stripe
  # SANDBOX (keys stay in your shell/password manager, never in this file):
  #   export STRIPE_SECRET_KEY=sk_test_...        STRIPE_PRICE_MONTHLY=price_...
  #   export STRIPE_PRICE_3MO=price_...           STRIPE_WEBHOOK_SECRET=whsec_...  (from `stripe listen`)
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-monthly: ${STRIPE_PRICE_MONTHLY:}
    price3mo: ${STRIPE_PRICE_3MO:}
    # Local checkout returns to the dev web app, not production.
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/pricing}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/settings#billing}
    # Merchant of record. Unset by default = whatever the Stripe account already does, which
    # for a new account means ON. Set STRIPE_MANAGED_PAYMENTS=false to force the plain Stripe
    # flow for a session, or =true to force MoR on an account that has it off.
    # An EMPTY default binds to null (Spring converts a blank string to null for a Boolean),
    # which is how "unset" is expressed here.
    managed-payments: ${STRIPE_MANAGED_PAYMENTS:}
    automatic-tax: ${STRIPE_AUTOMATIC_TAX:false}
  # Local dev points at MinIO (docker compose -f src/main/docker/minio.yml up -d).
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:dossier-resumes}
    access-key: ${STORAGE_ACCESS_KEY:dossier}
    secret-key: ${STORAGE_SECRET_KEY:dossier-secret}
    path-style-access: true
