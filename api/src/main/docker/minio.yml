# Local S3-compatible storage for development (resume blobs). Mirrors Cloudflare
# R2 in prod. Console at http://localhost:9001, API at http://localhost:9000.
# This is for development only — harden/replace for production.
#
# NOTE: images come from quay.io, NOT Docker Hub. MinIO removed the minio/minio and
# minio/mc repositories from Docker Hub entirely (they 404 there now, including :latest),
# which broke S3ResumeStorageServiceIT. quay.io still serves the identical RELEASE tags,
# so this is a registry change only - do not "simplify" these back to minio/minio.
name: dossierapi
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=dossier
      - MINIO_ROOT_PASSWORD=dossier-secret
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 10s
      retries: 10
  # Creates the resume bucket once MinIO is up.
  createbucket:
    image: quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dossier dossier-secret &&
      mc mb --ignore-existing local/dossier-resumes &&
      exit 0;
      "
volumes:
  minio-data:
